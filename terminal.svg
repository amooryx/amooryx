<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Terminal session: omar khalid, offensive security engineer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.16"/>
    </pattern>

    <clipPath id="screen">
      <rect x="16" y="16" width="808" height="368" rx="10"/>
    </clipPath>

    <!-- One clip per line; the rect width animates to reveal characters. -->
    <clipPath id="c1"><rect x="42" y="96"  width="0" height="26">
      <animate attributeName="width" values="0;0;87;87;0;0"
        keyTimes="0;0.071;0.143;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="42" y="130" width="0" height="26">
      <animate attributeName="width" values="0;0;424;424;0;0"
        keyTimes="0;0.157;0.229;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="42" y="176" width="0" height="26">
      <animate attributeName="width" values="0;0;138;138;0;0"
        keyTimes="0;0.243;0.314;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="42" y="210" width="0" height="26">
      <animate attributeName="width" values="0;0;587;587;0;0"
        keyTimes="0;0.329;0.400;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="42" y="256" width="0" height="26">
      <animate attributeName="width" values="0;0;260;260;0;0"
        keyTimes="0;0.414;0.486;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c6"><rect x="42" y="290" width="0" height="26">
      <animate attributeName="width" values="0;0;363;363;0;0"
        keyTimes="0;0.500;0.571;0.893;0.929;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="808" height="368" rx="10" fill="#05080d"/>
  <rect x="16" y="16" width="808" height="368" rx="10" fill="none"
        stroke="#00ff41" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- ambient glow from the top of the screen -->
  <rect x="16" y="52" width="808" height="150" fill="url(#glow)" clip-path="url(#screen)"/>

  <!-- title bar -->
  <path d="M16 26a10 10 0 0 1 10-10h788a10 10 0 0 1 10 10v26H16z" fill="#0d1117"/>
  <line x1="16" y1="52" x2="824" y2="52" stroke="#00ff41" stroke-opacity="0.22"/>
  <circle cx="42" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="34" r="6" fill="#27c93f"/>
  <text x="420" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#5b7083">amooryx@offsec — ~/engagements</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">

    <g clip-path="url(#c1)">
      <text x="42" y="115" fill="#00ff41" filter="url(#soft)">$ whoami</text>
    </g>
    <g clip-path="url(#c2)">
      <text x="42" y="149" fill="#c9d1d9">omar khalid · offensive security engineer</text>
    </g>

    <g clip-path="url(#c3)">
      <text x="42" y="195" fill="#00ff41" filter="url(#soft)">$ cat ./certs</text>
    </g>
    <g clip-path="url(#c4)">
      <text x="42" y="229" fill="#c9d1d9">OSCP+ · OSCP · CRTP · eWPTX · eCPPT · eCDFP · eCIR · eJPT</text>
    </g>

    <g clip-path="url(#c5)">
      <text x="42" y="275" fill="#00ff41" filter="url(#soft)">$ ./reconpal scan --scope</text>
    </g>
    <g clip-path="url(#c6)">
      <text x="42" y="309" fill="#7ee787">[+] 100 tools armed · surface mapped</text>
    </g>

    <!-- cursor: parks after the last line, blinks throughout -->
    <rect x="405" y="292" width="10" height="20" fill="#00ff41">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1"
               dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="x"
               values="52;52;129;466;302;302;405;405;52"
               keyTimes="0;0.071;0.143;0.329;0.486;0.500;0.571;0.929;1"
               dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y"
               values="98;98;132;132;258;258;292;292;98"
               keyTimes="0;0.071;0.143;0.329;0.486;0.500;0.571;0.929;1"
               dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CRT scanlines over everything -->
  <rect x="16" y="16" width="808" height="368" rx="10" fill="url(#scan)" pointer-events="none"/>
</svg>
